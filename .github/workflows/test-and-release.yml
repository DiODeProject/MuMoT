name: test_and_upload_distribution
on:
  # Trigger on tagged pushes to the master branch
  push:
    branches:
      - master
    tags:
      - 'v*'
  # Or on pull requests against the master branch
  pull_request:
    branches:
      - master
jobs:
  test_and_upload_distr_job:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Spawn and run a job for each supported Python 3.x version
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4
        with:
          # get all commits and tags, as needed by setuptools_scm
          fetch-depth: 0

      - name: Install MuMoT OS package dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive texlive-latex-extra graphviz dvipng cm-super
      - name: Set up a version of Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Upgrade pip and install generic Python build and test tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox build twine

      - name: Run tests using tox
        run: tox -e py

      - name: Capture coverage data
        uses: codecov/codecov-action@v4
        if: matrix.python == '3.12'

      - name: Build a binary wheel and a source tarball
        run: python -m build --sdist --wheel --outdir dist/ .

      - name: Publish distributions to Test PyPI if this is a tagged commit
        if: success() && matrix.python == '3.12' && github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.test_pypi_password }}
        run: |
          twine check dist/*
          twine upload --skip-existing --repository testpypi dist/*
      - name: Publish distributions to PyPI if this is a tagged commit
        if: success() && matrix.python == '3.12' && github.event_name == 'push' && startsWith(github.event.ref, 'refs/tags')
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.pypi_password }}
        run: twine upload --skip-existing dist/*
