[tox]
envlist = py310, py311, py312, py313
isolated_build = True

[testenv]
extras = 
    test
    docs
passenv =
    DISPLAY
    BROWSER
    TOXENV
deps = 
    coverage
allowlist_externals = 
    bash
    test
    wc
    make
commands = 
    ; Run unit tests and generate code coverage report
    pytest --verbose --cov-config=pyproject.toml --cov="{envsitepackagesdir}/mumot" tests

    ; Ensure test Notebooks runs *without errors* (do not check for regressions yet)
    ; (the per-cell timeout only guards against hangs: coverage tracing makes the
    ; symbolic noise calculations several times slower, so leave plenty of headroom)
    ; (add --nbdime if running tox locally and want to visualise/explore diffs in web browser)
    pytest --verbose --maxfail=1 --nbval-lax --nbval-cell-timeout=600 --cov-config=pyproject.toml --cov="{envsitepackagesdir}/mumot" --cov-append \
        TestNotebooks/MuMoTtest.ipynb \
        TestNotebooks/MiscTests/MuMoTtest_GreekLetters.ipynb \
        TestNotebooks/MiscTests/MuMoTtest_MultiController.ipynb \
        TestNotebooks/MiscTests/MuMoTtest_NoiseFixedPoints.ipynb \
        TestNotebooks/MiscTests/MuMoTtest_oneDimensionalModels.ipynb \
        TestNotebooks/MiscTests/MuMoTtest_1dstream.ipynb \
        TestNotebooks/MiscTests/MuMoTtest_3dstream.ipynb

    ; Ensure the user manual Notebook runs *without errors* (do not check for regressions yet),
    ; plus test Notebooks too slow to run under coverage (MasterEq has a ~2 minute cell)
    ; (add --nbdime if running tox locally and want to visualise/explore diffs in web browser)
    pytest --verbose --maxfail=1 --nbval-lax --nbval-cell-timeout=600 docs/MuMoTuserManual.ipynb \
        TestNotebooks/MiscTests/MuMoTtest_MasterEq.ipynb \
        TestNotebooks/MiscTests/MuMoTtest_bifurcation.ipynb

    ; The DemoNotebooks and docs/MuMoTpaperResults.ipynb also run without errors, but nbval fails the
    ; demos' multicontroller cells: their figures take longer to draw than nbval's fixed 5 s wait for
    ; output once a cell has finished (they pass with e.g. jupyter nbconvert --execute)

    ; Ensure the user manual and regression test Notebooks do not show regressions (TODO; leave commented)
    ; (add --nbdime if running tox locally and want to visualise/explore diffs in web browser)
    ; pytest --verbose --maxfail=1 --nbval --nbval-cell-timeout=600 --cov-config=pyproject.toml --cov="{envsitepackagesdir}/mumot" --cov-append TestNotebooks/MuMoTtest.ipynb

    ; Check user manual does not contain output cells
    bash -c 'test $(nbshow --outputs docs/MuMoTuserManual.ipynb | wc -c) -eq 0'  

    ; Check we can build the docs
    make --directory docs html
